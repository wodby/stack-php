name: php
icon: php
docs: https://wodby.com/docs/2.0/stacks/catalog/php/
title: PHP

services:
- name: php
  title: PHP
  service: php
  required: true
  links:
  - name: db
    service: mariadb
  - name: sendmail
    service: mailpit

- name: nginx
  title: Nginx
  service: php-nginx
  required: true
  links:
  - name: backend
    service: php

- name: mariadb
  title: MariaDB
  service: mariadb
  volumes:
  - name: data
    size: 20

- name: httpd
  title: Apache HTTP server
  service: php-httpd
  disabled: true
  links:
  - name: backend
    service: php

- name: postgres
  title: PostgreSQL
  service: postgres
  disabled: true  
  volumes:
  - name: data
    size: 20

- name: valkey
  title: Valkey
  service: valkey
  disabled: true  

- name: mailpit
  title: Mailpit
  service: mailpit

- name: opensmtpd
  disabled: true
  title: OpenSMTPD
  service: opensmtpd

- name: gotenberg
  title: Gotenberg
  service: gotenberg
  disabled: true  
